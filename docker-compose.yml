version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arya_gross
      POSTGRES_USER: arya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arya_gross_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arya -d arya_gross"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://arya:${POSTGRES_PASSWORD:-arya_gross_secret}@db:5432/arya_gross
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
